name: Publish gpu-service to GHCR

# Builds and pushes gpu-service's image to GitHub Container Registry so it
# can be pulled by RunPod, Hyperstack, or any other host — no Docker Hub
# account or extra credentials needed, just the repo's own GITHUB_TOKEN.
#
# NOTE: the resulting package (ghcr.io/<owner>/ttsopensource-gpu-service)
# inherits this repo's PRIVATE visibility by default. A pull host like
# RunPod then needs registry credentials to fetch it, OR you flip the
# package to public once (Package Settings -> Change visibility on
# github.com, or `gh auth refresh -s write:packages` then the GHCR API) —
# the image itself has no secrets baked in (API keys are injected at
# container runtime via env vars, never at build time), so public is safe.
on:
  push:
    branches: [master]
    paths:
      - "gpu-service/**"
      - "language-registry/**"
      - ".github/workflows/publish-gpu-service.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ttsopensource-gpu-service

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Same disk-space fix as docker.yml — torch pulls in the full CUDA
      # toolkit as pip deps and overflows the runner's default free disk.
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
