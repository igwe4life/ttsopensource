name: Publish orchestrator to GHCR

# Builds and pushes the orchestrator image so it can run on a small CPU host
# (e.g. a RunPod CPU pod) next to the GPU service. Contains no secrets —
# stream keys and API keys are injected as runtime env vars.
on:
  push:
    branches: [master]
    paths:
      - "orchestrator/**"
      - "language-registry/**"
      - ".github/workflows/publish-orchestrator.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ttsopensource-orchestrator

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
